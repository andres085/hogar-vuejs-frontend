<title>Hogar Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
:root{--surface-100:#f5f5f3;--surface-000:#ffffff;--surface-200:#e9e9e6;--line:#dcdcd8;--line-strong:#85857f;--ink:#1c1d1a;--ink-muted:#5a5b56;--bamboo-600:#4a7822;--on-brand:#ffffff;--bamboo-700:#38591a;--bamboo-100:#e3edd2;--bamboo-300:#a8c97a;--earth-500:#8a6a47;--earth-100:#f0e8dc;--earth-700:#68492b;--warn-bg:#f8edcc;--warn-ink:#74500a;--info-bg:#e0ebf5;--info-ink:#244e7a;--danger-bg:#f7e0d9;--danger-ink:#97321e;--danger-600:#a33822;--on-danger:#ffffff;--focus-ring:#1c1d1a;--shadow-card:0 1px 2px rgba(28,29,26,0.08), 0 2px 8px rgba(28,29,26,0.06);--shadow-sheet:0 -4px 24px rgba(28,29,26,0.18);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-xl:24px;--radius-pill:999px;--bp-md:768px;--bp-lg:1100px;--tap-min:44px;--nav-h:64px;--content-max:1120px;--font-display:"Fraunces", Georgia, "Times New Roman", serif;--font-sans:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--surface-100:#141413;--surface-000:#1c1c1a;--surface-200:#272725;--line:#353533;--line-strong:#84847e;--ink:#eeeeeb;--ink-muted:#ababa5;--bamboo-600:#9cc667;--on-brand:#141413;--bamboo-700:#b4da86;--bamboo-100:#26341b;--bamboo-300:#4d6e2c;--earth-500:#c4a27d;--earth-100:#33281c;--earth-700:#e0c4a1;--warn-bg:#3a2f10;--warn-ink:#f0cd74;--info-bg:#17283a;--info-ink:#a3c8ee;--danger-bg:#3b1c15;--danger-ink:#f4a898;--danger-600:#e8917f;--on-danger:#141413;--focus-ring:#eeeeeb;--shadow-card:0 1px 2px rgba(0,0,0,0.5);--shadow-sheet:0 -4px 24px rgba(0,0,0,0.6);color-scheme:dark}}
:root[data-theme="dark"]{--surface-100:#141413;--surface-000:#1c1c1a;--surface-200:#272725;--line:#353533;--line-strong:#84847e;--ink:#eeeeeb;--ink-muted:#ababa5;--bamboo-600:#9cc667;--on-brand:#141413;--bamboo-700:#b4da86;--bamboo-100:#26341b;--bamboo-300:#4d6e2c;--earth-500:#c4a27d;--earth-100:#33281c;--earth-700:#e0c4a1;--warn-bg:#3a2f10;--warn-ink:#f0cd74;--info-bg:#17283a;--info-ink:#a3c8ee;--danger-bg:#3b1c15;--danger-ink:#f4a898;--danger-600:#e8917f;--on-danger:#141413;--focus-ring:#eeeeeb;--shadow-card:0 1px 2px rgba(0,0,0,0.5);--shadow-sheet:0 -4px 24px rgba(0,0,0,0.6);color-scheme:dark}
.display-lg{font-family:var(--font-display);font-size:40px;line-height:46px;font-weight:600;margin:0}.display-md{font-family:var(--font-display);font-size:32px;line-height:38px;font-weight:600;margin:0}.display-sm{font-family:var(--font-display);font-size:28px;line-height:34px;font-weight:600;margin:0}.score{font-family:var(--font-display);font-size:56px;line-height:56px;font-weight:600;margin:0}.title{font-family:var(--font-sans);font-size:20px;line-height:28px;font-weight:600;margin:0}.subtitle{font-family:var(--font-sans);font-size:18px;line-height:24px;font-weight:600;margin:0}.body{font-family:var(--font-sans);font-size:16px;line-height:24px;font-weight:400;margin:0}.body-sm{font-family:var(--font-sans);font-size:14px;line-height:20px;font-weight:400;margin:0}.label{font-family:var(--font-sans);font-size:14px;line-height:20px;font-weight:600;margin:0}.caption{font-family:var(--font-sans);font-size:12px;line-height:16px;font-weight:500;margin:0}


.h-root{font-family:var(--font-sans);color:var(--ink);font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased}
.h-root *,.h-root *::before,.h-root *::after{box-sizing:border-box}
.h-root svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.h-stage{background:var(--surface-100);padding:var(--space-5)}
.h-row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
.h-col{display:flex;flex-direction:column;gap:var(--space-3)}
.h-spec{font:500 12px/16px var(--font-sans);color:var(--ink-muted);margin:0 0 var(--space-2)}
.h-root a{color:var(--bamboo-700)}
.h-root p{margin:0}.h-root h1,.h-root h2,.h-root h3{margin:0}
.h-wordmark{font:600 24px/28px var(--font-display);color:var(--bamboo-700);letter-spacing:-.01em}

/* Button */
.h-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:var(--tap-min);padding:0 var(--space-5);border:1px solid transparent;border-radius:var(--radius-md);font:600 16px/24px var(--font-sans);text-decoration:none;cursor:pointer;background:none;color:inherit}
.h-btn--primary{background:var(--bamboo-600);color:var(--on-brand)}
.h-btn--primary:hover{background:var(--bamboo-700)}
.h-root a.h-btn--primary{color:var(--on-brand)}
.h-btn--secondary{background:var(--surface-000);color:var(--ink);border-color:var(--line-strong)}
.h-btn--ghost{color:var(--bamboo-700);padding:0 var(--space-3)}
.h-btn--danger{background:var(--danger-600);color:var(--on-danger)}
.h-btn--block{display:flex;width:100%}
.h-btn--sm{min-height:36px;padding:0 var(--space-3);font-size:14px;line-height:20px}
.h-btn--disabled,.h-btn[disabled]{background:var(--surface-200);color:var(--ink-muted);border-color:var(--line);cursor:not-allowed}
.h-btn:focus-visible,.h-input:focus-visible,.h-focus{outline:3px solid var(--focus-ring);outline-offset:2px}

/* Field */
.h-field{display:flex;flex-direction:column;gap:6px}
.h-field__label{font:600 14px/20px var(--font-sans)}
.h-input{min-height:48px;padding:0 14px;border:1px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface-000);color:var(--ink);font:400 16px/24px var(--font-sans);display:flex;align-items:center;gap:var(--space-2);width:100%}
.h-input--area{align-items:flex-start;padding:12px 14px;min-height:96px}
.h-input--error{border:2px solid var(--danger-ink)}
.h-input .h-pre{color:var(--ink-muted)}
.h-input .h-end{margin-left:auto;color:var(--ink-muted);display:flex}
.h-help{font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
.h-help--error{color:var(--danger-ink)}
.h-choice{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface-000)}
.h-choice--on{border:2px solid var(--bamboo-600);padding:13px;background:var(--bamboo-100)}
.h-choice__t{font:600 16px/24px var(--font-sans)}
.h-choice__d{font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
.h-choice--on .h-choice__d{color:var(--ink)}
.h-radio{width:20px;height:20px;border:2px solid var(--line-strong);border-radius:50%;flex:none;margin-top:2px;display:grid;place-items:center;background:var(--surface-000)}
.h-choice--on .h-radio{border-color:var(--bamboo-600)}
.h-choice--on .h-radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--bamboo-600)}
.h-checkrow{display:flex;gap:12px;align-items:flex-start;font:400 14px/20px var(--font-sans)}
.h-checkbox{width:22px;height:22px;border:2px solid var(--line-strong);border-radius:6px;flex:none;display:grid;place-items:center;background:var(--surface-000);color:var(--on-brand)}
.h-checkbox--on{background:var(--bamboo-600);border-color:var(--bamboo-600)}
.h-checkbox svg.ic{width:14px;height:14px;stroke-width:3}
.h-switch{display:block;width:44px;height:26px;border-radius:var(--radius-pill);background:var(--line-strong);position:relative;flex:none}
.h-switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface-000)}
.h-switch--on{background:var(--bamboo-600)}.h-switch--on::after{left:21px}
.h-drop{border:2px dashed var(--line-strong);border-radius:var(--radius-lg);padding:20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-2);background:var(--surface-000)}
.h-drop svg.ic{width:28px;height:28px;color:var(--bamboo-700)}
.h-file{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-000)}
.h-file__i{width:40px;height:40px;border-radius:var(--radius-sm);background:var(--bamboo-100);color:var(--bamboo-700);display:grid;place-items:center;flex:none}
.h-file__b{flex:1;min-width:0}
.h-file__t{font:600 14px/20px var(--font-sans)}
.h-file__d{font:400 12px/16px var(--font-sans);color:var(--ink-muted)}
.h-file--error{border:2px solid var(--danger-ink);padding:11px 13px}
.h-file--error .h-file__i{background:var(--danger-bg);color:var(--danger-ink)}

/* Badge */
.h-badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:var(--radius-pill);font:600 12px/20px var(--font-sans);white-space:nowrap;max-width:100%}
.h-badge svg.ic{width:14px;height:14px;stroke-width:2.25}
.h-badge--ok{background:var(--bamboo-100);color:var(--bamboo-700)}
.h-badge--warn{background:var(--warn-bg);color:var(--warn-ink)}
.h-badge--info{background:var(--info-bg);color:var(--info-ink)}
.h-badge--danger{background:var(--danger-bg);color:var(--danger-ink)}
.h-badge--neutral{background:var(--surface-200);color:var(--ink)}
.h-badge--earth{background:var(--earth-100);color:var(--earth-700)}

/* Banner */
.h-banner{display:flex;gap:12px;padding:12px 14px;border-radius:var(--radius-md);font:400 14px/20px var(--font-sans)}
.h-banner svg.ic{margin-top:1px}
.h-banner b{display:block;font-weight:600}
.h-banner--warn{background:var(--warn-bg);color:var(--warn-ink)}
.h-banner--info{background:var(--info-bg);color:var(--info-ink)}
.h-banner--danger{background:var(--danger-bg);color:var(--danger-ink)}
.h-banner--ok{background:var(--bamboo-100);color:var(--bamboo-700)}

/* Card, list */
.h-card{background:var(--surface-000);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-4)}
.h-card--flat{padding:0;overflow:hidden}
.h-sec{font:600 14px/20px var(--font-sans);color:var(--ink-muted);text-transform:none;margin:var(--space-2) 0 0}
.h-li{display:flex;align-items:center;gap:12px;padding:12px var(--space-4);border-top:1px solid var(--line)}
.h-li:first-child{border-top:0}
.h-li__b{flex:1;min-width:0}
.h-li__t{font:600 16px/22px var(--font-sans)}
.h-li__d{font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
.h-tick{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--bamboo-100);color:var(--bamboo-700)}
.h-tick svg.ic{width:16px;height:16px;stroke-width:2.5}
.h-tick--todo{background:var(--surface-200);color:var(--ink-muted)}
.h-tick--warn{background:var(--warn-bg);color:var(--warn-ink)}
.h-seg{display:flex;gap:4px;padding:4px;border-radius:var(--radius-pill);background:var(--surface-200)}
.h-seg span{flex:1;text-align:center;padding:6px 8px;border-radius:var(--radius-pill);font:600 14px/20px var(--font-sans);color:var(--ink-muted)}
.h-seg .on{background:var(--surface-000);color:var(--ink);box-shadow:var(--shadow-card)}
.h-chips{display:flex;gap:8px;flex-wrap:wrap}
.h-chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--radius-pill);background:var(--surface-000);font:600 14px/20px var(--font-sans)}
.h-chip--on{background:var(--bamboo-100);border-color:var(--bamboo-600);color:var(--bamboo-700)}
.h-chip svg.ic{width:16px;height:16px}

/* Score */
.h-ring{position:relative;flex:none}
.h-ring__track{fill:none;stroke:var(--surface-200);stroke-width:10}
.h-ring__val{fill:none;stroke:var(--bamboo-600);stroke-width:10;stroke-linecap:round}
.h-ring__txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.h-ring--sm .h-ring__txt .score{font-size:22px;line-height:24px}
.h-ring--sm .h-ring__txt .caption{display:none}
.h-ring--sm .h-ring__track,.h-ring--sm .h-ring__val{stroke-width:12}
.h-bar{height:8px;border-radius:var(--radius-pill);background:var(--surface-200);overflow:hidden}
.h-bar i{display:block;height:100%;border-radius:var(--radius-pill);background:var(--bamboo-600)}
.h-factor{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.h-factor:first-child{border-top:0}
.h-factor__h{display:flex;justify-content:space-between;gap:8px;font:600 14px/20px var(--font-sans)}
.h-factor__h span:last-child{color:var(--ink-muted);font-weight:500}
.h-tip{display:flex;gap:12px;align-items:flex-start;font:400 14px/20px var(--font-sans)}
.h-tip svg.ic{color:var(--bamboo-700);margin-top:1px}

/* Property / candidate */
.h-photo{background:var(--surface-200);color:var(--ink-muted);display:grid;place-items:center;aspect-ratio:16/9;border-radius:var(--radius-md)}
.h-photo svg.ic{width:32px;height:32px}
.h-photo{overflow:hidden}
.h-photo svg.scene{display:block;width:100%;height:100%}
.h-prop{display:flex;flex-direction:column;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface-000)}
.h-prop--row{flex-direction:row;align-items:center}
.h-prop--row .h-photo{width:64px;aspect-ratio:1;flex:none}
.h-prop--row .h-photo svg.ic{width:24px;height:24px}
.h-price{font:600 20px/28px var(--font-sans)}
.h-price small{font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
.h-meta{display:flex;gap:12px;flex-wrap:wrap;font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
.h-meta span{display:inline-flex;gap:4px;align-items:center}
.h-meta svg.ic{width:16px;height:16px}
.h-cand{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface-000)}
.h-cand__rank{font:600 14px/20px var(--font-sans);color:var(--ink-muted);width:18px;text-align:center}
.h-avatar{width:44px;height:44px;border-radius:50%;background:var(--earth-100);color:var(--earth-700);display:grid;place-items:center;font:600 16px/20px var(--font-sans);flex:none}
.h-cand__b{flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:4px}
.h-cand__t{font:600 16px/22px var(--font-sans)}
.h-cand__d{font:400 12px/16px var(--font-sans);color:var(--ink-muted)}
.h-datarow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px var(--space-4);border-top:1px solid var(--line)}
.h-datarow:first-child{border-top:0}
.h-datarow__k{font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
.h-datarow__v{font:600 16px/22px var(--font-sans);text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* Stepper */
.h-steps{display:flex;flex-direction:column;gap:8px}
.h-steps__bar{display:flex;gap:6px}
.h-steps__bar i{flex:1;height:6px;border-radius:var(--radius-pill);background:var(--surface-200)}
.h-steps__bar i.on{background:var(--bamboo-600)}
.h-steps__t{font:600 14px/20px var(--font-sans);color:var(--ink-muted)}

/* Stats and table */
.h-stat{background:var(--surface-000);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-4);display:flex;flex-direction:column;gap:4px}
.h-stat__k{font:500 14px/20px var(--font-sans);color:var(--ink-muted)}
.h-stat__v{font:600 32px/38px var(--font-display);color:var(--ink)}
.h-stat__d{font:500 12px/16px var(--font-sans);color:var(--ink-muted)}
.h-grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.h-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4)}
.h-table{width:100%;border-collapse:collapse;font:400 14px/20px var(--font-sans);background:var(--surface-000)}
.h-table th{text-align:left;font:600 12px/16px var(--font-sans);color:var(--ink-muted);padding:10px var(--space-4);border-bottom:1px solid var(--line-strong);background:var(--surface-100)}
.h-table td{padding:12px var(--space-4);border-bottom:1px solid var(--line)}
.h-table td.num,.h-table th.num{text-align:right;font-variant-numeric:tabular-nums}
.h-tablewrap{border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}

/* Shell, navigation */
.h-top{display:flex;align-items:center;gap:var(--space-2);min-height:56px;padding:0 var(--space-4);background:var(--surface-000);border-bottom:1px solid var(--line)}
.h-top__t{font:600 18px/24px var(--font-sans);flex:1}
.h-top .ic{flex:none}
.h-bottomnav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;min-height:var(--nav-h);background:var(--surface-000);border-top:1px solid var(--line)}
.h-bottomnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 12px/16px var(--font-sans);color:var(--ink-muted);text-decoration:none;padding:6px 0}
.h-root .h-bottomnav a{color:var(--ink-muted)}
.h-bottomnav a span.pill{display:grid;place-items:center;width:56px;height:30px;border-radius:var(--radius-pill)}
.h-root .h-bottomnav a.on{color:var(--bamboo-700)}
.h-bottomnav a.on span.pill{background:var(--bamboo-100)}
.h-sidenav{display:flex;flex-direction:column;gap:4px;padding:var(--space-4);background:var(--surface-000);border-right:1px solid var(--line)}
.h-sidenav a{display:flex;align-items:center;gap:12px;min-height:var(--tap-min);padding:0 12px;border-radius:var(--radius-md);font:600 15px/20px var(--font-sans);text-decoration:none}
.h-root .h-sidenav a{color:var(--ink)}
.h-root .h-sidenav a.on{background:var(--bamboo-100);color:var(--bamboo-700)}
.h-shell{display:grid;grid-template-columns:1fr;min-height:100vh}
.h-shell__nav{display:none}.h-shell__tabs{display:grid;position:sticky;bottom:0}
@media (min-width:768px){.h-shell{grid-template-columns:240px 1fr}.h-shell__nav{display:flex}.h-shell__tabs{display:none}}

/* Mock frames used by the view galleries */
.h-gallery{display:flex;flex-wrap:wrap;gap:var(--space-6);padding:var(--space-5);background:var(--surface-200);align-items:flex-start}
.h-view{margin:0;width:340px;display:flex;flex-direction:column;gap:10px}
.h-cap{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font:600 14px/20px var(--font-sans)}
.h-cap .id{background:var(--ink);color:var(--surface-000);border-radius:var(--radius-sm);padding:0 8px;font-size:12px;line-height:20px}
.h-cap .cu{font-weight:500;font-size:12px;color:var(--ink-muted);flex-basis:100%}
.h-phone{position:relative;display:flex;flex-direction:column;min-height:660px;border:1px solid var(--line-strong);border-radius:28px;overflow:hidden;background:var(--surface-100)}
.h-body{flex:1;display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-4)}
.h-cta{display:flex;flex-direction:column;gap:8px;padding:12px var(--space-4);background:var(--surface-000);border-top:1px solid var(--line)}
.h-scrim{position:absolute;inset:0;background:rgba(20,20,19,.55)}
.h-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface-000);border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:var(--space-4) var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);box-shadow:var(--shadow-sheet)}
.h-sheet__grab{width:40px;height:4px;border-radius:2px;background:var(--line-strong);align-self:center}
.h-desk{width:1100px;margin:0;display:flex;flex-direction:column;gap:10px}
.h-desk__f{display:grid;grid-template-columns:230px 1fr;border:1px solid var(--line-strong);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface-100);min-height:520px}

<script>
/* =====================================================================
   Datos semilla de la demo.
   Todo lo que la demo muestra sale de acá + lo que la persona hace.
   Las fechas son relativas a "hoy" (días atrás) para que la demo no
   envejezca: "últimos 12 meses" siempre significa los últimos 12 meses.
   Si cambiás la forma de estos datos, subí SEED_VERSION: así los
   navegadores que tenían una partida guardada arrancan de cero.
   ===================================================================== */
const SEED_VERSION = 2;
const DAY = 864e5;
const ago = d => Date.now() - d * DAY;

/* Inmobiliarias piloto. acc = cierres acumulados desde el alta,
   c12 = cuántos de esos cayeron en los últimos 12 meses. A partir de
   estos números se generan los cierres con fecha (ver seedClosings). */
const SEED_AGENCIES = () => [
  {n:'Inmobiliaria Del Sur',a:'Ana D.',g:3,p:41,s:'Activa',acc:41,c12:11},
  {n:'Casa Norte Propiedades',a:'Pablo G.',g:2,p:29,s:'Activa',acc:29,c12:8},
  {n:'Costa Inmuebles',a:'Rocío M.',g:6,p:64,s:'Pausada',acc:64,c12:26},
  {n:'Hogar Austral',a:'Nicolás T.',g:1,p:7,s:'Baja',acc:2,c12:0}
];

/* Cierres con fecha, repartidos de forma determinística (siempre iguales).
   Los de 12 meses caen entre hoy y hace 360 días; el resto, más atrás. */
function seedClosings(){
  const out = [];
  SEED_AGENCIES().forEach((ag, k) => {
    for (let i = 0; i < ag.c12; i++) out.push({agency:ag.n, at:ago(Math.round(4 + k*3 + i*(355/ag.c12)) % 360), demo:false});
    for (let i = 0; i < ag.acc - ag.c12; i++) out.push({agency:ag.n, at:ago(380 + i*17 + k*5), demo:false});
  });
  return out;
}

function readPhoto(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const m=900, k=Math.min(1,m/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.82)); }; img.onerror=rej; img.src=fr.result; }; fr.onerror=rej; fr.readAsDataURL(file); }); }

/* ---------- scoring ---------- */
function calc(p){
  const income = p.proof ? p.incomeNet : null;
  const ratio = income ? p.budget / income : null;
  let f1;
  if (ratio == null) f1 = {pts:10,lvl:'Sin dato',pct:25,note:'Sin comprobante no podemos medir cuánto de tu ingreso va al alquiler.'};
  else {
    const r = Math.round(ratio*100);
    if (ratio <= .35) f1 = {pts:35,lvl:'Muy bien',pct:100};
    else if (ratio <= .40) f1 = {pts:28,lvl:'Bien',pct:80};
    else if (ratio <= .50) f1 = {pts:16,lvl:'Ajustado',pct:45};
    else f1 = {pts:6,lvl:'Alto',pct:20};
    f1.note = `Tu presupuesto es el ${r}% de tu ingreso neto. La referencia es 35–40%.`;
  }
  const f2 = !p.proof ? {pts:0,lvl:'No suma',pct:0,note:'Todavía no subiste un comprobante de ingresos.'}
    : p.incomeEdited ? {pts:10,lvl:'Suma poco',pct:45,note:'Corregiste el ingreso: queda como no verificado.'}
    : {pts:20,lvl:'Suma',pct:85,note:'Comprobante verificado a nombre del titular del DNI.'};
  const s = Math.min(p.seniority,5)*3;
  const f3 = {pts:s,lvl:s>=12?'Suma':s>0?'Suma poco':'No suma',pct:Math.round(s/15*100),note:`${p.seniority} ${p.seniority===1?'año':'años'}, declarada.`};
  const f4 = p.guarantee ? {pts:15,lvl:'Suma',pct:70,note:'Declarada. La inmobiliaria valida el tipo.'} : {pts:0,lvl:'No suma',pct:0,note:'No declaraste garantía.'};
  const total = Math.min(100, 10 + f1.pts + f2.pts + f3.pts + f4.pts);
  return {total, f1, f2, f3, f4, ratio};
}

  const cie = closingsOf(null, 56);
  return {id:'D1',title:'Métricas',cus:'CU-29',admin:true,
  body:`<div class="h-row"><div class="h-input" style="width:190px;min-height:40px"><span>Últimas 8 semanas</span><span class="h-end">${ic('down')}</span></div><div class="h-input" style="width:210px;min-height:40px"><span>Todas las inmobiliarias</span><span class="h-end">${ic('down')}</span></div></div>`
   + `<div class="h-grid4"><div class="h-stat"><span class="h-stat__k">Registros</span><span class="h-stat__v">${regs}</span><span class="h-stat__d">${Math.round(m.tenantShare*100)}% inquilinos</span></div><div class="h-stat"><span class="h-stat__k">Pasaportes completos</span><span class="h-stat__v">${comp}</span><span class="h-stat__d">${Math.round(comp/regs*100)}% de los registros</span></div><div class="h-stat"><span class="h-stat__k">Postulaciones</span><span class="h-stat__v">${post}</span><span class="h-stat__d">${(post/comp).toFixed(1).replace('.',',')} por pasaporte</span></div><div class="h-stat"><span class="h-stat__k">Cierres</span><span class="h-stat__v">${cie}</span><span class="h-stat__d">en el período</span></div></div>`
   + `<div class="h-card"><div class="h-li__t" style="margin-bottom:8px">Registros por semana</div><svg viewBox="0 0 480 180" width="100%" role="img" aria-label="Registros por semana, de ${vals[0]} a ${vals[vals.length-1]}" style="font-family:var(--font-sans);max-height:210px">${bars}<path d="M12 150H470" stroke="var(--line-strong)"/></svg></div>`}; };
sc['a-cie'] = () => { const rows = S.agencies.map(a=>({n:a.n, acc:closingsOf(a.n), c:closingsOf(a.n,365)})); const dc = demoClosings();
  return {id:'D2',title:'Cierres y canon',cus:'CU-30',admin:true,
  body: banner('info','Piloto sin cobro','El canon es una referencia: canon = $20.000 × (1 + 0,02 × cierres de 12 meses, hasta 25). El cobro arranca en Fase 2.')
   + (dc?banner('ok','Cierre de la demo registrado',`${OWNER_AGENCY} sumó ${dc} ${dc===1?'cierre':'cierres'} desde el panel del propietario.`):'')
   + `<div class="h-tablewrap"><div class="h-scrollx"><table class="h-table"><thead><tr><th>Inmobiliaria</th><th class="num">Cierres acumulados</th><th class="num">Últimos 12 meses</th><th class="num">Canon calculado</th><th>Estado</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.n}</td><td class="num">${r.acc}</td><td class="num">${r.c}</td><td class="num">${money(canon(r.c))}</td><td>${r.c>=25?badge('Tope +50%','earth'):badge('Piloto sin cobro','neutral')}</td></tr>`).join('')}</tbody></table></div></div>`}; };
sc['a-ocr'] = () => { const rows = S.ocr.slice().sort((a,b)=>b.at-a.at);
  const avg = Math.round(rows.reduce((s,r)=>s+r.conf,0)/rows.length), low = rows.filter(r=>r.conf<70).length;
  const cnt = {}; let tot = 0; rows.forEach(r=>r.fixed.forEach(f=>{ cnt[f]=(cnt[f]||0)+1; tot++; }));
  const top = Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  const st = r => r.st==='rejected' ? badge('Titular no coincide','danger','alert') : r.conf<70 ? badge('Confianza baja','warn','alert') : badge('Ok','ok','check');
  return {id:'D3',title:'Auditoría OCR',cus:'CU-31',admin:true,
  body:`<div class="h-grid4" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div class="h-stat"><span class="h-stat__k">Confianza promedio</span><span class="h-stat__v">${avg}%</span></div><div class="h-stat"><span class="h-stat__k">Documentos con confianza baja</span><span class="h-stat__v">${low}</span></div><div class="h-stat"><span class="h-stat__k">Campo más corregido</span><span class="h-stat__v" style="font-size:24px">${top?top[0]:'—'}</span><span class="h-stat__d">${top?Math.round(top[1]/tot*100)+'% de las correcciones':'Sin correcciones'}</span></div></div>`
   + `<div class="h-tablewrap"><div class="h-scrollx"><table class="h-table"><thead><tr><th>Fecha</th><th>Documento</th><th class="num">Confianza</th><th class="num">Campos corregidos</th><th>Estado</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${fdate(r.at)}</td><td>${r.kind}${r.mine?' <span class="h-help">· Lucía (demo)</span>':''}</td><td class="num">${r.conf}%</td><td class="num" title="${esc(r.fixed.join(', '))}">${r.fixed.length}</td><td>${st(r)}</td></tr>`).join('')}</tbody></table></div></div>`}; };
sc['a-inm'] = () => ({id:'D4',title:'Inmobiliarias piloto',cus:'CU-32 (deseable)',admin:true,
  body:`<div class="h-tablewrap"><div class="h-scrollx"><table class="h-table"><thead><tr><th>Inmobiliaria</th><th>Administrador</th><th class="num">Agentes</th><th class="num">Propiedades</th><th>Estado</th><th></th></tr></thead><tbody>${S.agencies.map((a,i)=>`<tr><td>${a.n}</td><td>${a.a}</td><td class="num">${a.g}</td><td class="num">${a.p}</td><td>${badge(a.s,{Activa:'ok',Pausada:'warn',Baja:'neutral'}[a.s])}</td><td style="text-align:right">${btn(a.s==='Activa'?'Pausar':'Activar','agency',{kind:'secondary',sm:true,d:{i}})}</td></tr>`).join('')}</tbody></table></div></div>`});

/* ---------- render ---------- */
const ROLES = [['land','Inicio'],['reg','Registro'],['t','Inquilino'],['o','Propietario'],['adm','Admin CRM']];
function topbar(d){
  if (d.top==='none') return '';
  if (d.top==='logo') return `<header class="h-top"><span class="h-top__t">${d.title}</span></header>`;
  if (d.top==='logoO') return `<header class="h-top"><span class="h-top__t">${d.title}</span><span class="h-top__t" style="text-align:right;font-size:14px;color:var(--ink-muted)">Inmobiliaria Del Sur</span></header>`;
  if (d.top==='propsTop') return `<header class="h-top"><span class="h-top__t">Propiedades</span>${btn('Publicar','go',{sm:true,icon:'plus',d:{to:'o-new'}})}</header>`;
  if (d.top==='equipoTop') return `<header class="h-top"><span class="h-top__t">Equipo</span>${btn('Agregar','toast',{sm:true,icon:'plus',d:{v:'En la versión real se invita al agente por email.'}})}</header>`;
  return `<header class="h-top">${d.back?`<button class="h-plain h-iconbtn" data-act="back" aria-label="Volver">${ic('back')}</button>`:''}<span class="h-top__t">${d.title}</span></header>`;
}
function sheetHtml(){
  if(!S.sheet) return '';
  const k=S.sheet;
  const pr=S.props.find(x=>x.id===S.curProp);
  const content = k==='rent' ? `<h2 class="title">¿Marcar como alquilado?</h2><p class="body-sm">${pr.title}. Se pausa la publicación y se registra el cierre.</p>${btn('Marcar como alquilado','rent',{block:true})}${btn('Cancelar','closeSheet',{kind:'ghost',block:true})}`
    : `<h2 class="title">¿Eliminar tu cuenta?</h2><p class="body-sm">En esta demo se reinicia todo al estado inicial.</p>${btn('Sí, eliminar','reset',{kind:'danger',block:true})}${btn('Cancelar','closeSheet',{kind:'ghost',block:true})}`;
  return `<div class="h-scrim" data-act="closeSheet"></div><div class="h-sheet" role="dialog" aria-modal="true"><span class="h-sheet__grab"></span>${content}</div>`;
}
/* ---------- persistencia: la partida queda guardada en este navegador ---------- */
const STORE_KEY = 'hogar-demo-state-v' + SEED_VERSION;   // cambia con la semilla: datos viejos no se mezclan
function saveState(){ try { localStorage.setItem(STORE_KEY, JSON.stringify({...S, toast:null, sheet:null})); } catch (e) {} }
function clearSaved(){ try { localStorage.removeItem(STORE_KEY); } catch (e) {} }
function loadSaved(){
  try {
    const raw = localStorage.getItem(STORE_KEY); if (!raw) return null;
    const saved = JSON.parse(raw), base = fresh();
    // se mezcla con fresh() para que un campo nuevo en la semilla no rompa partidas viejas
    const s = {...base, ...saved, p:{...base.p, ...saved.p, processing:false, editing:false}, sheet:null, toast:null};
    if (!sc[s.screen]) { s.role = 'land'; s.screen = 'l1'; s.hist = []; }
    return s;
  } catch (e) { return null; }
}

let lastScreen = null;
function render(keepScroll=true){
  const d = sc[S.screen]();
  const y = window.scrollY; const same = keepScroll && lastScreen === S.screen; lastScreen = S.screen;
  const role = S.role;
  document.getElementById('tabs').innerHTML = ROLES.map(([k,l])=>`<button class="rtab${role===k?' on':''}" data-act="role" data-v="${k}" ${role===k?'aria-current="true"':''}>${l}</button>`).join('');
  const dev = document.getElementById('device');
  dev.className = 'device' + (d.admin?' wide':'');
  const toastHtml = S.toast ? `<div class="toast" role="status">${S.toast}</div>` : '';
  let inner;
  if (d.landing) {
    inner = d.body;
  } else if (d.admin) {
    inner = `<div class="adm"><aside class="h-sidenav">${ADM.map(([k,i,l])=>`<button class="h-plain navb ${S.screen===k?'on':''}" data-act="tab" data-to="${k}">${ic(i)}${l}</button>`).join('')}</aside><div class="appmain admmain"><header class="h-top"><span class="h-top__t">${d.title}</span></header><main class="admbody">${d.body}</main></div></div>`;
  } else {
    const dock = d.nav?nav(d.nav==='t'?NAV_T:NAV_O,S.screen):'';
    const items = d.nav ? (d.nav==='t'?NAV_T:NAV_O) : null;
    const side = items ? `<aside class="h-sidenav side">${items.map(([k,i,l])=>`<button class="h-plain navb ${((tabOf[S.screen]||S.screen)===k)?'on':''}" data-act="tab" data-to="${k}">${ic(i)}${l}</button>`).join('')}</aside>` : '';
    inner = `<div class="app${items?' has-side':''}">${side}<div class="appmain">${topbar(d)}<main class="scroll"><div class="h-body" data-w="${d.wide?'wide':'narrow'}">${d.body}${d.cta?`<div class="h-cta h-cta--inline">${d.cta}</div>`:''}</div></main>${dock?`<div class="dock">${dock}</div>`:''}</div></div>`;
  }
  dev.innerHTML = inner + sheetHtml() + toastHtml;
  window.scrollTo(0, same ? y : 0);
  document.getElementById('cap').innerHTML = `<span class="id">${d.id}</span><span>${d.title}</span><span class="cu">${d.cus}</span>`;
  saveState();
}
let toastT;
function toast(t){ S.toast=t; clearTimeout(toastT); toastT=setTimeout(()=>{S.toast=null;render();},2600); }
function go(to,push=true){ if(S.role==='land' && /^a\d/.test(to)) S.role='reg'; if(push) S.hist.push(S.screen); S.screen=to; S.sheet=null; render(false); }
function enter(role,to){ S.role=role; S.screen=to; S.hist=[]; S.sheet=null; render(false); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  if (a==='noop'){ e.preventDefault(); return; }
  if (a==='scrollto'){ e.preventDefault(); const t=document.getElementById(el.dataset.to); if(t) t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}); return; }
  if (a.startsWith('start:')){ S.rolePick=a.split(':')[1]; enter('reg','a1'); return; }
  if (a==='role'){ const m={land:'l1',reg:'a1',t:'t-pas',o:'o-panel',adm:'a-met'}; enter(v,m[v]); return; }
  if (a==='go'){ e.preventDefault(); go(el.dataset.to); return; }
  if (a==='back'){ const to=S.hist.pop()||sc[S.screen]().back; S.screen=to; S.sheet=null; render(false); return; }
  if (a==='tab'){ S.hist=[]; if(el.dataset.to==='a1'){enter('reg','a1');return;} S.screen=el.dataset.to; S.sheet=null; render(false); return; }
  if (a.startsWith('pick:')){ S.rolePick=a.split(':')[1]; render(); return; }
  if (a==='terms'){ S.terms=!S.terms; render(); return; }
  if (a==='consent'){ S.consent=!S.consent; render(); return; }
  if (a==='a1next'){ go('a3'); return; }
  if (a==='a3next'||a==='enterT'){ if(a==='a3next') S.signups++; if(S.rolePick==='t'||a==='enterT') enter('t','t-pas'); else enter('o','o-panel'); toast('Cuenta creada. Esto es una demo.'); return; }
  if (a==='decl'||a.startsWith('decl:')){ S.p.declared = a==='decl:1'; render(); return; }
  if (a==='guar'){ S.p.guarantee=!S.p.guarantee; render(); return; }
  if (a==='ctype'){ S.p.type=v; render(); return; }
  if (a==='upload'){ S.p.error=false; S.p.processing=true; render();
    const ok=el.dataset.ok==='1'; setTimeout(()=>{ S.p.processing=false; S.ocr.push({at:Date.now(),kind:S.p.type,conf:ok?84:93,fixed:[],st:ok?'ok':'rejected',mine:true}); if(ok){S.myOcr=S.ocr.length-1;S.p.proof=true;S.p.incomeEdited=false;S.p.error=false;S.p.declared=true;toast('Comprobante leído y archivo borrado. Score recalculado.');} else {S.p.error=true;} render(); },1300); return; }
  if (a==='skip'){ S.hist=[]; S.screen='t-pas'; toast('Podés subir el comprobante más tarde. Tu score es menor sin él.'); render(false); return; }
  if (a==='editIncome'){ S.p.editing=!S.p.editing; render(); return; }
  if (a==='confirm'){ go('t-score'); toast('Score recalculado.'); return; }
  if (a==='fb'){ S.filterBudget=!S.filterBudget; render(); return; }
  if (a==='openProp'){ S.curPropT=+id; go('t-prop'); return; }
  if (a==='apply'){ S.apps.push({pid:S.curPropT,status:'sent'}); toast('Postulación enviada con tu Pasaporte.'); render(); return; }
  if (a==='ptab'){ S.postTab=v; render(); return; }
  if (a==='withdraw'){ const ap=S.apps.find(x=>x.pid===+id&&x.status==='sent'); if(ap) ap.status='withdrawn'; toast('Retiraste tu postulación.'); render(); return; }
  if (a==='sheet'){ S.sheet=v; render(); return; }
  if (a==='closeSheet'){ S.sheet=null; render(); return; }
  if (a==='reset'){ clearSaved(); S=fresh(); enter('land','l1'); toast('Cuenta eliminada. Demo reiniciada.'); return; }
  if (a==='toast'){ toast(v); return; }
  /* owner */
  if (a==='oseg'){ S.ownerSeg=v; render(); return; }
  if (a==='ocands'){ S.curProp=+id; go('o-cands'); return; }
  if (a==='pausep'){ const x=S.props.find(p=>p.id===+id); x.status=x.status==='paused'?'active':'paused'; toast(x.status==='paused'?'Publicación pausada.':'Publicación reanudada.'); render(); return; }
  if (a==='cf'){ S.candFilter=!S.candFilter; render(); return; }
  if (a==='opencand'){ S.curCand=id; go('o-cand'); return; }
  if (a==='decide'){ const l=candList(S.curProp); const c=l.find(x=>x.id===S.curCand);
    if (c.me){ const ap=S.apps.find(x=>x.pid===S.curProp&&x.status==='sent'); if(ap) ap.status=v; } else c.status=v;
    toast(v==='selected'?'Candidato seleccionado.':'Candidato descartado.'); render(); return; }
  if (a==='rent'){ const pr=S.props.find(x=>x.id===S.curProp); pr.status='rented'; S.closings.push({agency:OWNER_AGENCY,at:Date.now(),demo:true,pid:pr.id}); const l=candList(pr.id); const c=l.find(x=>x.id===S.curCand); if(c&&!c.me) c.status='rented'; S.sheet=null; toast('Alquiler cerrado. Se registró el cierre.'); render(); return; }
  if (a==='publish'){ const f=S.newForm; const n=Math.max(...S.props.map(p=>p.id))+1; S.props.push({id:n,sc:0,title:f.title,zone:f.zone,price:+String(f.price).replace(/\D/g,''),feats:[],status:'active',agent:f.agent,desc:'Propiedad publicada desde la demo.',exp:0,pets:'—',contract:'24 meses'}); S.cands[n]=[]; if(f.photo){PHOTOS[n]=f.photo; if(!savePhotos()) toast('La foto se ve ahora, pero no entra en la memoria del navegador.');} S.newForm={title:'',zone:'',price:'',agent:'Marcos P.',photo:''}; S.hist=[]; S.screen='o-props'; toast('Propiedad publicada. Ya aparece en la búsqueda del inquilino.'); render(false); return; }
  if (a==='perm'){ const k=el.dataset.k; S.perms[k]=!S.perms[k]; render(); return; }
  if (a==='agency'){ const ag=S.agencies[+el.dataset.i]; ag.s=ag.s==='Activa'?'Pausada':'Activa'; render(); return; }
});
document.addEventListener('change', async e => {
  const b = e.target.dataset && e.target.dataset.bind; if(!b) return;
  if (b==='photo' || b==='newphoto') {
    const file = e.target.files && e.target.files[0]; if(!file) return;
    try { const url = await readPhoto(file);
      if (b==='photo') { PHOTOS[e.target.dataset.id==='hero'?'hero':+e.target.dataset.id] = url; if(!savePhotos()) toast('La foto se ve ahora, pero no entra en la memoria del navegador.'); else toast('Foto actualizada. Ya se ve en la búsqueda del inquilino.'); }
      else { S.newForm.photo = url; }
    } catch (err) { toast('No pude leer esa imagen. Probá con un JPG o PNG.'); }
    render(); return;
  }
  const num = s => parseInt(String(s).replace(/\D/g,''),10)||0;
  if (b==='budget'){ S.p.budget = Math.max(100000, num(e.target.value)); }
  if (b==='income'){ const n=num(e.target.value); if(n!==S.p.incomeNet){S.p.incomeNet=Math.max(1,n);S.p.incomeEdited=true; const r=S.ocr[S.myOcr]; if(r&&!r.fixed.includes('Ingreso neto')) r.fixed.push('Ingreso neto');} }
  if (b==='sen'){ S.p.seniority=+e.target.value; }
  if (b==='nt') S.newForm.title=e.target.value; if (b==='nz') S.newForm.zone=e.target.value; if (b==='np') S.newForm.price=e.target.value; if (b==='na') S.newForm.agent=e.target.value;
  render();
});
document.getElementById('reset').addEventListener('click',()=>{ clearSaved(); S=fresh(); toast('Demo reiniciada con los datos de ejemplo.'); render(false); });
const restored = loadSaved();
if (restored) S = restored;
try { render(false); } catch (e) { clearSaved(); S = fresh(); render(false); }   // partida guardada corrupta: arranca limpio
if (restored && S.screen !== 'l1') { toast('Retomaste la demo donde la dejaste. “Reiniciar demo” vuelve al inicio.'); render(); }

/* theme: arranca siempre en claro; el botón alterna */
let theme = 'light';
try { theme = localStorage.getItem('hogar-theme') || 'light'; } catch (e) {}
const themeBtn = document.getElementById('theme');
function applyTheme(){ document.documentElement.setAttribute('data-theme', theme); themeBtn.textContent = theme === 'dark' ? 'Tema oscuro' : 'Tema claro'; themeBtn.setAttribute('aria-pressed', theme === 'dark'); }
themeBtn.addEventListener('click', () => { theme = theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('hogar-theme', theme); } catch (e) {} applyTheme(); });
applyTheme();

</script>
